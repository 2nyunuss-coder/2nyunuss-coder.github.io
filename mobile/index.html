<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#12385f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="RPYS Cep">
  <meta name="description" content="RPYS'nin telefon ve tabletler için güvenli mobil erişim katmanı.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon.svg">
  <title>RPYS Cep</title>
  <style>
    :root{color-scheme:light;--navy:#12385f;--blue:#1e5b91;--ink:#15324c;--muted:#64788b;--line:#d7e3ed;--bg:#edf4f9;--safe-bottom:env(safe-area-inset-bottom,0px)}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink)}
    button{font:inherit}
    .app-frame{position:fixed;inset:0 0 calc(66px + var(--safe-bottom));width:100%;height:calc(100dvh - 66px - var(--safe-bottom));border:0;background:var(--bg)}
    .loading{position:fixed;inset:0 0 calc(66px + var(--safe-bottom));z-index:3;display:grid;place-items:center;padding:24px;background:linear-gradient(150deg,#f7fbfe,#e7f1f8)}
    .loading-card{width:min(390px,92vw);padding:26px 22px;border:1px solid var(--line);border-radius:22px;background:#fff;box-shadow:0 20px 60px #12385f20;text-align:center}
    .mark{display:grid;place-items:center;width:62px;height:62px;margin:0 auto 16px;border-radius:18px;background:linear-gradient(145deg,var(--navy),var(--blue));color:#fff;font-size:20px;font-weight:900;letter-spacing:-1px;box-shadow:0 10px 24px #12385f35}
    .loading h1{margin:0 0 8px;font-size:23px;letter-spacing:-.4px}.loading p{margin:0;color:var(--muted);font-size:15px;line-height:1.5}
    .loader{width:38px;height:38px;margin:20px auto 0;border:4px solid #dce8f1;border-top-color:var(--blue);border-radius:50%;animation:turn .8s linear infinite}@keyframes turn{to{transform:rotate(360deg)}}
    .error{display:none;margin-top:18px;padding:12px;border:1px solid #f2b9b6;border-radius:12px;background:#fff1f0;color:#92241f;font-size:14px;line-height:1.4}
    .retry{display:none;width:100%;min-height:46px;margin-top:12px;border:0;border-radius:12px;background:var(--navy);color:#fff;font-weight:800}
    .bottom-nav{position:fixed;z-index:10;left:0;right:0;bottom:0;height:calc(66px + var(--safe-bottom));display:grid;grid-template-columns:repeat(5,1fr);padding:5px 4px var(--safe-bottom);border-top:1px solid #cbd9e5;background:rgba(255,255,255,.96);box-shadow:0 -8px 25px #12385f12;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
    .nav-btn{min-width:0;border:0;border-radius:12px;background:transparent;color:#65798c;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:750;line-height:1}
    .nav-btn .icon{font-size:21px;line-height:1}.nav-btn.active{background:#e6f0f8;color:var(--navy)}
    .offline{position:fixed;z-index:20;top:max(8px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:none;padding:8px 13px;border-radius:999px;background:#8b2c25;color:#fff;font-size:12px;font-weight:800;box-shadow:0 6px 18px #0002;white-space:nowrap}
    body.is-offline .offline{display:block}
    @media(min-width:800px){.bottom-nav{left:50%;right:auto;width:520px;transform:translateX(-50%);bottom:12px;height:68px;padding:5px;border:1px solid #cbd9e5;border-radius:20px;box-shadow:0 12px 35px #12385f25}.app-frame{inset:0;height:100dvh}.loading{inset:0}.nav-btn{font-size:12px}}
  </style>
</head>
<body>
  <div id="offline" class="offline" role="status">İnternet bağlantısı yok</div>
  <section id="loading" class="loading" aria-live="polite">
    <div class="loading-card">
      <div class="mark" aria-hidden="true">RPYS</div>
      <h1>RPYS Cep hazırlanıyor</h1>
      <p id="loadingText">Güncel ve güvenli RPYS açılıyor…</p>
      <div id="loader" class="loader" aria-hidden="true"></div>
      <div id="error" class="error"></div>
      <button id="retry" class="retry" type="button">Tekrar Dene</button>
    </div>
  </section>

  <iframe id="rpysFrame" class="app-frame" title="RPYS uygulaması" src="../?rpys_mobile_shell=1"></iframe>

  <nav class="bottom-nav" aria-label="RPYS Cep menüsü">
    <button class="nav-btn active" type="button" data-page="dashboard"><span class="icon">⌂</span><span>Ana Sayfa</span></button>
    <button class="nav-btn" type="button" data-page="nobet"><span class="icon">▦</span><span>Nöbet</span></button>
    <button class="nav-btn" type="button" data-page="saymanlik"><span class="icon">∑</span><span>Saymanlık</span></button>
    <button class="nav-btn" type="button" data-page="izin"><span class="icon">✓</span><span>İzin</span></button>
    <button class="nav-btn" type="button" data-action="menu"><span class="icon">☰</span><span>Menü</span></button>
  </nav>

  <script src="./mobile.js" defer></script>
</body>
</html>
