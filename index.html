<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17365d">
<title>RPYS Bulut</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Segoe UI,Arial,sans-serif;background:#eef4f9;color:#17365d}body{min-height:100vh;display:grid;place-items:center}.card{width:min(600px,92vw);background:#fff;border:1px solid #dbe5ef;border-radius:18px;padding:30px;box-shadow:0 18px 55px #17365d20}.spin{width:42px;height:42px;border:4px solid #dce8f2;border-top-color:#17365d;border-radius:50%;animation:s .8s linear infinite;margin-bottom:16px}@keyframes s{to{transform:rotate(360deg)}}h1{font-size:23px;margin:0 0 8px}p{font-size:13px;color:#64748b;line-height:1.5}.bar{height:9px;background:#e7eef5;border-radius:999px;overflow:hidden;margin:18px 0}.fill{height:100%;width:12%;background:#1f4e78;transition:width .3s}.err{display:none;margin-top:14px;padding:11px;border-radius:9px;background:#fff1f0;border:1px solid #ffc9c5;color:#a61b14;font-size:12px;white-space:pre-wrap}.small{font-size:11px;color:#718399;margin-top:12px}
</style>
</head>
<body>
<div class="card">
<div class="spin"></div>
<h1>☁ RPYS Bulut</h1>
<p id="status">En güncel RPYS hazırlanıyor…</p>
<div class="bar"><div id="fill" class="fill"></div></div>
<div id="err" class="err"></div>
<div class="small">Program GitHub Pages üzerinden açılır; uygulama ve ana veri güvenli Supabase katmanından gelir.</div>
</div>
<script>
(async()=>{
 const APP_SOURCE='https://wiflnajancyomgdtheyr.supabase.co/functions/v1/rpys-app-source';
 const status=document.getElementById('status'),fill=document.getElementById('fill'),err=document.getElementById('err');
 const replaceOnce=(s,a,b)=>s.includes(a)?s.replace(a,b):s;
 const MOBILE_CSS=`<style id="rpys-mobile-secure-v302">
.rpysMobileMenuBtn,.rpysMobileBackdrop{display:none}
@media(max-width:900px){
 html,body{max-width:100%!important;overflow-x:hidden!important;-webkit-text-size-adjust:100%}
 body{padding-bottom:env(safe-area-inset-bottom)}
 .app{display:block!important;min-height:100dvh!important;width:100%!important}
 .sidebar{position:fixed!important;left:0!important;top:0!important;bottom:0!important;width:min(84vw,310px)!important;max-width:310px!important;height:100dvh!important;max-height:100dvh!important;display:block!important;overflow-y:auto!important;overflow-x:hidden!important;transform:translateX(-104%);transition:transform .22s ease;z-index:10020!important;padding:12px!important;box-shadow:8px 0 28px rgba(10,28,48,.28)}
 body.rpysMobileMenuOpen .sidebar{transform:translateX(0)}
 .rpysMobileMenuBtn{display:flex!important;position:fixed;left:max(10px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));z-index:10030;width:46px;height:46px;border:0;border-radius:13px;background:#17365d;color:#fff;align-items:center;justify-content:center;font-size:24px;font-weight:900;box-shadow:0 6px 18px rgba(0,0,0,.22)}
 .rpysMobileBackdrop{display:none;position:fixed;inset:0;z-index:10010;background:rgba(7,20,34,.42);backdrop-filter:blur(1px)}
 body.rpysMobileMenuOpen .rpysMobileBackdrop{display:block}
 .sideSearchWrap{position:sticky!important;top:0!important;z-index:10!important}
 .nav{width:100%!important;min-width:0!important;min-height:42px!important;margin:2px 0!important;font-size:12px!important}
 .main{width:100%!important;min-width:0!important;margin:0!important;padding:64px 9px 12px!important;overflow:visible!important}
 .topbar{position:sticky!important;top:0!important;z-index:100!important;display:flex!important;flex-wrap:wrap!important;align-items:center!important;gap:6px!important;background:rgba(247,251,255,.96)!important;backdrop-filter:blur(8px);padding:8px 6px!important;margin:0 0 8px!important;border-radius:10px}
 .topbar h1,.top h1{font-size:18px!important;line-height:1.15!important;max-width:100%!important}
 .actions,.toolbar,.simSampleControls,.saySourceBar,.suaControls,.topbar>div{max-width:100%!important;overflow-x:auto!important;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
 button,.btn,select,input,textarea{min-height:42px!important;font-size:16px!important}
 input[type=checkbox],input[type=radio]{min-height:auto!important;transform:scale(1.12)}
 .panel,.card,.notice,.autoBox,.grid2,.grid3,.cards,.dashGrid3,.dashboardProGrid,.ownerGrid,.rulesGrid,.printCenterGrid,.reportControls,.qualityPanel,.healthPanel{min-width:0!important;max-width:100%!important}
 .grid2,.grid3,.autoBox,.cards,.dashGrid3,.dashboardProGrid,.ownerGrid,.rulesGrid,.reportControls,.printCenterGrid{grid-template-columns:1fr!important}
 .tablewrap,.virtualTableWrap,.analysisTrendWrap,.suaTableWrap,.managementHeatmap,.dashboardHeatmap{width:100%!important;max-width:calc(100vw - 18px)!important;overflow:auto!important;-webkit-overflow-scrolling:touch!important;overscroll-behavior-x:contain}
 #polGrid,#acilGrid,#say1Grid,#say2Grid{width:100%!important;max-width:100%!important;min-height:54vh!important;overflow:auto!important}
 #polGrid table,#acilGrid table,#say1Grid table,#say2Grid table,.schedule,.say{min-width:920px!important;width:max-content!important;max-width:none!important}
 .tablewrap table{max-width:none}
 .rpysFixedTools{right:7px!important;bottom:8px!important;z-index:9990!important;max-width:48vw!important}
 .v24MasterBadge{left:7px!important;right:auto!important;bottom:8px!important;max-width:46vw!important;font-size:8px!important;z-index:9980!important}
 .autoSaveBadge{right:7px!important;bottom:58px!important;max-width:42vw!important;font-size:8px!important}
 #loginOverlay{padding:12px!important;align-items:center!important}
 .loginCard{width:min(430px,96vw)!important;padding:20px!important;border-radius:17px!important}
 .loginCard h2{font-size:22px!important}.loginField input{font-size:16px!important}
 .rpysModal{padding:8px!important}.rpysModal>div,.modalCard{max-width:96vw!important;max-height:92dvh!important;overflow:auto!important}
 .bulkSizeGrid,.validationCards,.fairCards,.profileGrid,.fiiliUnitChecks,.fiiliCalcSettings,.simKpis,.analysisCards,.dashStats3,.managementKpis{grid-template-columns:1fr 1fr!important}
}
@media(max-width:560px){
 .main{padding-left:6px!important;padding-right:6px!important}
 .panel{padding:8px!important;border-radius:10px!important}
 .bulkSizeGrid,.validationCards,.fairCards,.profileGrid,.fiiliUnitChecks,.fiiliCalcSettings,.simKpis,.analysisCards,.dashStats3,.managementKpis{grid-template-columns:1fr!important}
 .topbar select,.topbar button{max-width:100%!important}
 #polGrid table,#acilGrid table,#say1Grid table,#say2Grid table,.schedule,.say{min-width:860px!important}
}
</style>`;
 const MOBILE_JS=`<script id="rpys-mobile-secure-runtime-v302">(()=>{function closeMenu(){document.body.classList.remove('rpysMobileMenuOpen')}function setup(){if(!document.querySelector('.sidebar')||document.getElementById('rpysMobileMenuBtn'))return;let b=document.createElement('button');b.id='rpysMobileMenuBtn';b.className='rpysMobileMenuBtn';b.type='button';b.setAttribute('aria-label','Menüyü aç');b.textContent='☰';b.onclick=()=>document.body.classList.toggle('rpysMobileMenuOpen');let o=document.createElement('div');o.className='rpysMobileBackdrop';o.onclick=closeMenu;document.body.append(o,b);document.querySelectorAll('.sidebar .nav').forEach(n=>n.addEventListener('click',()=>{if(innerWidth<=900)closeMenu()}));addEventListener('resize',()=>{if(innerWidth>900)closeMenu()});}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',setup);else setup()})();<\\/script>`;
 function fail(e){document.querySelector('.spin').style.display='none';fill.style.width='12%';err.style.display='block';err.textContent='RPYS açılamadı:\n'+String(e&&e.message||e)+'\n\nSayfayı yenileyip tekrar deneyin.';status.textContent='Bulut bağlantısı kurulamadı.'}
 function repair(app){
   app=replaceOnce(app,
     '</div></div></div></div></div></div>\n<div class="panel" id="acilPanel"',
     '</div></div></div></div></div>\n<div class="panel" id="acilPanel"');
   app=replaceOnce(app,
     '</div></div></div></div></div></div>\n</section>\n\n\n<section class="page" id="vardiyalar">',
     '</div></div></div></div></div>\n</section>\n\n\n<section class="page" id="vardiyalar">');
   const sig='<div class="sayScreenSignatures"><div><b data-rpys-sig-name="0"></b><span data-rpys-sig-role="0"></span><em>İmza</em></div><div><b data-rpys-sig-name="1"></b><span data-rpys-sig-role="1"></span><em>İmza</em></div><div><b data-rpys-sig-name="2"></b><span data-rpys-sig-role="2"></span><em>İmza</em></div></div>';
   app=replaceOnce(app,sig+'\n<div class="panel" id="say2Panel"',sig+'\n</div>\n<div class="panel" id="say2Panel"');
   app=replaceOnce(app,sig+'\n</section>\n\n\n<section class="page" id="goruntuler">',sig+'\n</div>\n</section>\n\n\n<section class="page" id="goruntuler">');
   app=replaceOnce(app,
     'title.textContent=b.textContent.replace(/^[^A-Za-zÇĞİÖŞÜçğıöşü]+/,"").trim();save();requestAnimationFrame(()=>renderPage(b.dataset.p))',
     'title.textContent=b.textContent.replace(/^[^A-Za-zÇĞİÖŞÜçğıöşü]+/,"").trim();try{localStorage.setItem("rpys_last_page",b.dataset.p)}catch(_){}window.scrollTo(0,0);requestAnimationFrame(()=>renderPage(b.dataset.p))');
   app=replaceOnce(app,'db.ui.lastDutyTab=b.dataset.s;save()','db.ui.lastDutyTab=b.dataset.s;try{localStorage.setItem("rpys_last_duty_tab",b.dataset.s)}catch(_){}');
   app=replaceOnce(app,'db.ui.lastSayTab=b.dataset.y;save()','db.ui.lastSayTab=b.dataset.y;try{localStorage.setItem("rpys_last_say_tab",b.dataset.y)}catch(_){}');
   app=replaceOnce(app,'db.ui.lastMonth=month.value;save();renderCurrentPage()','db.ui.lastMonth=month.value;try{localStorage.setItem("rpys_last_month",month.value)}catch(_){}renderCurrentPage()');
   app=replaceOnce(app,'setInterval(()=>{if(_storageReady)v24RefreshServerStatus()},5000);','setInterval(()=>{if(_storageReady&&!document.hidden)v24RefreshServerStatus()},60000);');
   app=replaceOnce(app,'function setUserPassword(id,pw){let u=db.users.find(x=>x.id===id);if(u&&pw){u.password=pw;save()}}',`async function setUserPassword(id,pw){
  if(!pw)return;
  if(String(pw).length<8){alert("Şifre en az 8 karakter olmalı.");return}
  try{
    let tok=rpysCloudSession();if(!tok)throw new Error("Bulut oturumu gerekli.");
    let r=await fetch(RPYS_CLOUD_API+"/change-password",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+tok},body:JSON.stringify({userId:id,newPassword:pw})});
    let o={};try{o=await r.json()}catch(_){}if(!r.ok)throw new Error(o.error||"Şifre değiştirilemedi.");
    if(o.token){try{localStorage.setItem("rpys_cloud_session",o.token);sessionStorage.setItem("rpys_cloud_session",o.token)}catch(_){}}
    let u=db.users.find(x=>x.id===id);if(u)u.password="__REDACTED__";
    alert("Şifre güvenli şekilde değiştirildi. Diğer eski oturumlar geçersiz kılındı.");
  }catch(e){alert(e?.message||"Şifre değiştirilemedi.")}
}`);
   if(!app.includes('rpys-mobile-secure-v302'))app=app.replace(/<\/head>/i,MOBILE_CSS+'</head>');
   if(!app.includes('rpys-mobile-secure-runtime-v302'))app=app.replace(/<\/body>/i,MOBILE_JS+'</body>');
   app=app.replaceAll('v3.0.0-TAM-BULUT','v3.0.2-MOBILE-SECURE').replaceAll('v3.0.0 TAM BULUT','v3.0.2 MOBILE SECURE');
   return app;
 }
 function validate(app){
   const d=new DOMParser().parseFromString(app,'text/html');
   const main=d.querySelector('main.main');
   if(!main)throw new Error('Ana çalışma alanı bulunamadı.');
   const direct=main.querySelectorAll(':scope > section.page').length;
   if(direct<40)throw new Error('Sayfa yapısı doğrulanamadı ('+direct+'/40).');
   const s1=d.getElementById('say1Panel'),s2=d.getElementById('say2Panel'),say=d.getElementById('saymanlik');
   if(!s1||!s2||!say||s1.parentElement!==say||s2.parentElement!==say)throw new Error('SAY1/SAY2 yapısı doğrulanamadı.');
   for(const id of ['nobet','vardiyalar','saymanlik','goruntuler','personel','izin']){const el=d.getElementById(id);if(!el||el.parentElement!==main)throw new Error(id+' sayfası yanlış konumda.');}
 }
 try{
   fill.style.width='24%';
   status.textContent='RPYS güvenli bulut kaynağından indiriliyor…';fill.style.width='46%';
   const r=await fetch(APP_SOURCE+'?t='+Date.now(),{cache:'no-store'});
   if(!r.ok)throw new Error('RPYS paketi alınamadı (HTTP '+r.status+')');
   const version=r.headers.get('x-rpys-version')||'güncel';
   let app=await r.text();
   if(app.length<1000000||!app.includes('RPYS'))throw new Error('Buluttaki RPYS paketi eksik.');
   status.textContent='Sayfa yapısı doğrulanıyor…';fill.style.width='70%';
   app=repair(app);validate(app);
   fill.style.width='95%';status.textContent='RPYS hazır, açılıyor…';
   setTimeout(()=>{document.open('text/html','replace');document.write(app);document.close();},70);
 }catch(e){fail(e)}
})();
</script>
</body>
</html>
