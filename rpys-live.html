<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RPYS LIVE</title><style>body{font-family:Segoe UI,Arial,sans-serif;background:#eef4f9;color:#17365d;display:grid;place-items:center;min-height:100vh;margin:0}.c{background:#fff;padding:28px;border-radius:16px;box-shadow:0 12px 40px #17365d22;max-width:520px;width:90%}.s{font-size:13px;color:#64748b}</style></head><body><div class="c"><h2>RPYS LIVE</h2><div id="s" class="s">En güncel sürüm GitHub RAW üzerinden alınıyor…</div></div><script>(async()=>{const s=document.getElementById('s');try{const u='https://raw.githubusercontent.com/2nyunuss-coder/2nyunuss-coder.github.io/main/index.html?live='+Date.now();const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error('RAW HTTP '+r.status);let h=await r.text();if(!h.includes('RPYS Bulut'))throw new Error('Güncel açıcı doğrulanamadı');s.textContent='Güncel açıcı bulundu, RPYS başlatılıyor…';setTimeout(()=>{document.open('text/html','replace');document.write(h);document.close()},100)}catch(e){s.textContent='RPYS LIVE açılamadı: '+(e?.message||e)}})();</script></body></html>
