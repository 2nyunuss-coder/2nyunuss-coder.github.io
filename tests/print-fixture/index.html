<!doctype html><html lang="tr"><meta charset="utf-8"><title>RPYS Toplu Yazdırma • Örnek Veri</title><style>body{font:16px Arial;background:#eef4fa;color:#17365d;padding:30px}section{background:white;border:1px solid #ccd9e6;border-radius:12px;padding:20px;margin:15px 0}button{padding:12px;background:#17365d;color:white;border:0;border-radius:8px;cursor:pointer}</style><h1>Toplu yazdırma doğrulaması</h1><p>Yalnızca örnek kayıtlar. Buluta bağlanmaz.</p><select id="month"><option value="2026-10">Ekim 2026</option></select><section id="saymanlik"><h2>Açık saymanlık penceresi</h2><p>Bu pencerenin açık olması paket çıktısını değiştirmemeli.</p></section><section id="yazdir"><h2>Yazdırma Merkezi</h2><div id="r377v4"><div data-pack="0"><p>Ekim saymanlık × 2; Eylül nöbet (poliklinik ve acil) × 1</p><button id="fixturePrint">Paketi Yazdır</button></div></div></section><p id="result"></p><script>

function stableSayDoc(names,label){return stablePrintHeader('SAYMANLIK — '+label)+'<table class="stableSay"><thead><tr><th>Tarih</th>'+names.map(n=>'<th>'+n+'</th>').join('')+'</tr></thead><tbody>'+Array.from({length:31},(_,i)=>'<tr><td>'+(i+1)+'</td>'+names.map(()=>'<td>08:00–15:00</td>').join('')+'</tr>').join('')+'</tbody></table>'+stableSignatures()}
